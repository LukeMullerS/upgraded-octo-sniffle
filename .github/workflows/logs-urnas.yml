# Base estática dos logs das urnas (public/urnas), montada aos poucos no GitHub Actions, direto
# do TSE e sem passar pelo site:
# - a cada hora, lê por até 45 min, no máximo 120 seções por minuto (para não sobrecarregar o TSE);
# - cada log é baixado uma vez só (os logs não mudam), e só de cidades com 100% das seções
#   totalizadas: no 1º turno, todas; na noite do 2º turno, cada cidade entra assim que fecha;
# - o progresso fica no cache do Actions e a base gerada vai para o repositório (o Vercel publica).
# A partir de 25/10/2026 também compila o 2º turno (public/urnas/2t).
# Agendamentos só rodam no branch padrão; em outro branch, use Actions → "Logs das urnas" → Run workflow.
name: Logs das urnas

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      ritmo:
        description: 'Seções por minuto (no máximo)'
        default: '120'
        required: true
      minutos:
        description: 'Minutos lendo nesta execução'
        default: '45'
        required: true

permissions:
  contents: write

concurrency:
  group: logs-urnas
  cancel-in-progress: false

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: dados/urnas-retrato
          key: urnas-retrato-${{ github.run_id }}
          restore-keys: urnas-retrato-
      - name: Ler logs (só seções de cidades 100% totalizadas)
        env:
          TSE_BASE: https://resultados.tse.jus.br/oficial
          RITMO: ${{ github.event.inputs.ritmo || '120' }}
          MINUTOS: ${{ github.event.inputs.minutos || '45' }}
        run: |
          if [ "$(date -u +%Y%m%d)" -ge 20261025 ]; then
            # Noite do 2º turno em diante: metade do tempo para cada turno.
            METADE=$(( MINUTOS / 2 ))
            node scripts/atualizar-urnas.mjs --turno=2 --ritmo="$RITMO" --max-minutos="$METADE" --concorrencia=4
            node scripts/atualizar-urnas.mjs --turno=1 --ritmo="$RITMO" --max-minutos="$METADE" --concorrencia=4
          else
            node scripts/atualizar-urnas.mjs --turno=1 --ritmo="$RITMO" --max-minutos="$MINUTOS" --concorrencia=4
          fi
      - name: Gravar no repositório
        run: |
          if git diff --quiet -- public/urnas && [ -z "$(git ls-files --others --exclude-standard public/urnas)" ]; then
            echo "nada mudou"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/urnas
          git commit -m "Atualiza a base dos logs das urnas"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
