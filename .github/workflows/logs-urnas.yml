# Compila a base estática dos logs das urnas (public/urnas) no GitHub, sem passar pelo site:
# um job por UF (em paralelo) baixa do TSE os logs das seções e guarda o resumo de cada cidade;
# o último job junta tudo, gera public/urnas e grava no repositório (o Vercel publica).
# O resumo por cidade fica no cache do Actions: rodar de novo só lê as seções que faltam.
#
# Rode em Actions → "Logs das urnas" → Run workflow. "amostra" = seções por cidade
# (0 = todas, o que são centenas de milhares de logs; 10 já dá estatísticas firmes por UF).
name: Logs das urnas

on:
  workflow_dispatch:
    inputs:
      amostra:
        description: 'Seções por cidade (0 = todas)'
        default: '10'
        required: true

permissions:
  contents: write

concurrency:
  group: logs-urnas
  cancel-in-progress: false

jobs:
  uf:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        uf: [rr, ap, ac, to, ro, se, al, am, rn, pb, pi, ms, mt, df, es, ma, pa, go, sc, ce, pe, pr, rs, ba, rj, mg, sp, zz]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: dados/urnas-retrato/${{ matrix.uf }}
          key: urnas-${{ matrix.uf }}-${{ github.event.inputs.amostra }}-${{ github.run_id }}
          restore-keys: |
            urnas-${{ matrix.uf }}-${{ github.event.inputs.amostra }}-
            urnas-${{ matrix.uf }}-
      - name: Ler os logs da UF
        env:
          TSE_BASE: https://resultados.tse.jus.br/oficial
        run: node scripts/atualizar-urnas.mjs --ufs=${{ matrix.uf }} --amostra=${{ github.event.inputs.amostra }} --concorrencia=8 --so-baixar
      - uses: actions/upload-artifact@v4
        with:
          name: urnas-${{ matrix.uf }}
          path: dados/urnas-retrato/${{ matrix.uf }}
          if-no-files-found: ignore
          retention-days: 3

  juntar:
    needs: uf
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: urnas-*
          path: baixados
      - name: Gerar public/urnas
        run: |
          mkdir -p dados/urnas-retrato
          for d in baixados/urnas-*; do [ -d "$d" ] && cp -r "$d" "dados/urnas-retrato/${d#baixados/urnas-}"; done
          node scripts/atualizar-urnas.mjs --so-gerar
      - name: Gravar no repositório
        run: |
          if git diff --quiet -- public/urnas && [ -z "$(git ls-files --others --exclude-standard public/urnas)" ]; then
            echo "nada mudou"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/urnas
          git commit -m "Atualiza a base dos logs das urnas"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
