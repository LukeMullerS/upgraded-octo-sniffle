# Base estática dos logs das urnas (public/urnas), montada aos poucos no GitHub Actions, direto
# do TSE e sem passar pelo site:
# - a cada hora, lê por até 45 min, o mais rápido que o TSE aguentar: a concorrência se ajusta sozinha
#   (sobe enquanto não há erro nem lentidão; cai à metade a qualquer 429/5xx e respeita o Retry-After);
# - cada log é baixado uma vez só (os logs não mudam), e só de cidades com 100% das seções
#   totalizadas: no 1º turno, todas; na noite do 2º turno, cada cidade entra assim que fecha;
# - o progresso fica no cache do Actions e a base é publicada no repositório a cada 15 min
#   (o Vercel publica cada commit).
# A partir de 25/10/2026 também compila o 2º turno (public/urnas/2t).
# Agendamentos só rodam no branch padrão; em outro branch, use Actions → "Logs das urnas" → Run workflow.
name: Logs das urnas

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      ritmo:
        description: 'Teto de seções por minuto (0 = automático, o máximo que o TSE aguentar)'
        default: '0'
        required: true
      minutos:
        description: 'Minutos lendo nesta execução'
        default: '45'
        required: true

permissions:
  contents: write

concurrency:
  group: logs-urnas
  cancel-in-progress: false

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: dados/urnas-retrato
          key: urnas-retrato-${{ github.run_id }}
          restore-keys: urnas-retrato-
      # Lê em blocos de 15 min e publica ao fim de cada bloco: o site mostra o progresso durante a
      # execução, sem gastar deploys demais (cada commit é um deploy no Vercel; o plano grátis
      # permite cerca de 100 por dia, por isso não publica a cada minuto).
      - name: Ler logs (só cidades 100% totalizadas) e publicar a cada 15 min
        env:
          TSE_BASE: https://resultados.tse.jus.br/oficial
          RITMO: ${{ github.event.inputs.ritmo || '0' }}
          MINUTOS: ${{ github.event.inputs.minutos || '45' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publicar() {
            if git diff --quiet -- public/urnas && [ -z "$(git ls-files --others --exclude-standard public/urnas)" ]; then
              echo "nada novo para publicar"; return 0
            fi
            git add public/urnas
            git commit -q -m "Atualiza a base dos logs das urnas"
            for i in 1 2 3; do git pull -q --rebase && git push -q && return 0; sleep 5; done
            return 1
          }
          BLOCO=15
          RESTA=$MINUTOS
          while [ "$RESTA" -gt 0 ]; do
            M=$(( RESTA < BLOCO ? RESTA : BLOCO ))
            if [ "$(date -u +%Y%m%d)" -ge 20261025 ]; then
              # Do 2º turno em diante: metade de cada bloco para cada turno.
              node scripts/atualizar-urnas.mjs --turno=2 --ritmo="$RITMO" --max-minutos=$(( (M + 1) / 2 )) --concorrencia=8 --concorrencia-max=96
              node scripts/atualizar-urnas.mjs --turno=1 --ritmo="$RITMO" --max-minutos=$(( M / 2 )) --concorrencia=8 --concorrencia-max=96
            else
              node scripts/atualizar-urnas.mjs --turno=1 --ritmo="$RITMO" --max-minutos="$M" --concorrencia=8 --concorrencia-max=96
            fi
            publicar
            RESTA=$(( RESTA - M ))
          done
      # O progresso (resumo de cada seção lida) fica no cache mesmo se a execução for interrompida.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dados/urnas-retrato
          key: urnas-retrato-${{ github.run_id }}
